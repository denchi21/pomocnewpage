    <meta name="theme-color" content="#f6f5f0">
    <script>
      (() => {
        const SAVED_THEME = localStorage.getItem('pomoc-theme');
        const PREFERRED_THEME = window.matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light';
        document.documentElement.dataset.theme = SAVED_THEME || PREFERRED_THEME;
      })();
    </script>

    <link rel="icon" href="src/images/favicon.svg" type="image/svg+xml">
    <link rel="preload" as="image" href="src/images/heroimagehigh.jpg" imagesrcset="src/images/heroimage.jpg 960w, src/images/heroimagehigh.jpg 1920w" imagesizes="100vw" fetchpriority="high">
